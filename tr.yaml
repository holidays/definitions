# Turkish holiday definitions for the Ruby Holiday gem.
#
# Updated: 2026-08-25
#
# Note:
# Ramazan Bayramı and Kurban Bayramı fall on fixed days of the Hijri
# calendar (1 Shawwal and 10 Dhul-Hijjah respectively). The ramadan_feast
# and sacrifice_feast custom methods compute them from a tabular Islamic
# calendar calculation in the consuming libraries, with a per-year override
# for the years where Türkiye's Diyanet proclamation differs from the
# arithmetic. See definitions#377 and definitions#55.
#
# Roughly once every 33 years a fixed Hijri date lands twice in the same
# Gregorian year (e.g. Ramazan Bayramı in 2033, Kurban Bayramı in 2039); the
# function returns only the first occurrence, so tests here stop before the
# first such year.
#
# Sources:
# - https://en.wikipedia.org/wiki/Public_holidays_in_Turkey
# - https://www.timeanddate.com/holidays/turkey/
# - https://de.wikipedia.org/wiki/Feiertage_in_der_Türkei
# - https://de.wikipedia.org/wiki/Ramadan#Beginn_und_Ende_des_Ramadans
# - https://de.wikipedia.org/wiki/Islamisches_Opferfest#Opferfest-Termine
# - https://translate.yandex.com/?lang=en-tr
# - https://de.wikibooks.org/wiki/Türkisch:_Zahlen
# - https://en.wikipedia.org/wiki/Democracy_and_National_Unity_Day
# - https://vakithesaplama.diyanet.gov.tr/resmitatiller.php (2021-2030 dates)
---
region_names:
  tr: "Türkiye"
months:
  0:
  - name: Ramazan Bayramı # Ramadan Feast
    regions: [tr]
    function: ramadan_feast(year)
  - name: Ramazan Bayramı (ikinci tatil) # Ramadan Feast, 2nd holiday
    regions: [tr]
    function: ramadan_feast(year)
    function_modifier: 1
  - name: Ramazan Bayramı (üçüncü tatil) # Ramadan Feast, 3rd holiday
    regions: [tr]
    function: ramadan_feast(year)
    function_modifier: 2
  - name: Kurban Bayramı # Sacrifice Feast
    regions: [tr]
    function: sacrifice_feast(year)
  - name: Kurban Bayramı (ikinci tatil) # Sacrifice Feast, 2nd holiday
    regions: [tr]
    function: sacrifice_feast(year)
    function_modifier: 1
  - name: Kurban Bayramı (üçüncü tatil) # Sacrifice Feast, 3rd holiday
    regions: [tr]
    function: sacrifice_feast(year)
    function_modifier: 2
  - name: Kurban Bayramı (dördüncü tatil) # Sacrifice Feast, 4th holiday
    regions: [tr]
    function: sacrifice_feast(year)
    function_modifier: 3
  1:
  - name: Yılbaşı # New Year's Day
    regions: [tr]
    mday: 1
  4:
  - name: Ulusal Egemenlik ve Çocuk Bayramı # National Sovereignty and Children's Day
    regions: [tr]
    mday: 23
  5:
  - name: Emek ve Dayanışma Günü # Labour and Solidarity Day
    regions: [tr]
    mday: 1
  - name: Atatürk'ü Anma Gençlik ve Spor Bayramı # Commemoration of Atatürk, Youth and Sports Day
    regions: [tr]
    mday: 19
  7:
  - name: Demokrasi ve Milli Birlik Günü # Democracy and National Unity Day
    regions: [tr]
    mday: 15
    year_ranges:
      from: 2016
  8:
  - name: Zafer Bayramı # Victory Day
    regions: [tr]
    mday: 30
  10:
  - name: Cumhuriyet Bayramı # Republic Day
    regions: [tr]
    mday: 29
tests:
  - given:
      date: '2017-1-1'
      regions: ["tr"]
    expect:
      name: "Yılbaşı"
  - given:
      date: '2017-4-23'
      regions: ["tr"]
    expect:
      name: "Ulusal Egemenlik ve Çocuk Bayramı"
  - given:
      date: '2017-5-1'
      regions: ["tr"]
    expect:
      name: "Emek ve Dayanışma Günü"
  - given:
      date: '2017-5-19'
      regions: ["tr"]
    expect:
      name: "Atatürk'ü Anma Gençlik ve Spor Bayramı"
  - given:
      date: '2017-8-30'
      regions: ["tr"]
    expect:
      name: "Zafer Bayramı"
  - given:
      date: '2017-10-29'
      regions: ["tr"]
    expect:
      name: "Cumhuriyet Bayramı"
  - given:
      date: ['2017-6-25', '2018-6-15', '2019-6-4', '2020-5-24', '2021-5-13', '2022-5-2', '2023-4-21', '2024-4-10', '2025-3-30', '2026-3-20', '2027-3-9', '2028-2-26', '2029-2-15', '2030-2-4', '2031-1-25', '2032-1-14']
      regions: ["tr"]
    expect:
      name: "Ramazan Bayramı"
  - given:
      date: ['2017-6-26', '2018-6-16', '2019-6-5', '2020-5-25', '2021-5-14', '2022-5-3', '2023-4-22', '2024-4-11', '2025-3-31', '2026-3-21', '2027-3-10', '2028-2-27', '2029-2-16', '2030-2-5', '2031-1-26', '2032-1-15']
      regions: ["tr"]
    expect:
      name: "Ramazan Bayramı (ikinci tatil)"
  - given:
      date: ['2017-6-27', '2018-6-17', '2019-6-6', '2020-5-26', '2021-5-15', '2022-5-4', '2023-4-23', '2024-4-12', '2025-4-1', '2026-3-22', '2027-3-11', '2028-2-28', '2029-2-17', '2030-2-6', '2031-1-27', '2032-1-16']
      regions: ["tr"]
    expect:
      name: "Ramazan Bayramı (üçüncü tatil)"
  - given:
      date: '2017-7-15'
      regions: ["tr"]
    expect:
      name: "Demokrasi ve Milli Birlik Günü"
  - given:
      date: ['2017-9-1', '2018-8-21', '2019-8-11', '2020-7-31', '2021-7-20', '2022-7-9', '2023-6-28', '2024-6-16', '2025-6-6', '2026-5-27', '2027-5-16', '2028-5-5', '2029-4-24', '2030-4-13', '2031-4-3', '2032-3-22']
      regions: ["tr"]
    expect:
      name: "Kurban Bayramı"
  - given:
      date: ['2017-9-2', '2018-8-22', '2019-8-12', '2020-8-01', '2021-7-21', '2022-7-10', '2023-6-29', '2024-6-17', '2025-6-7', '2026-5-28', '2027-5-17', '2028-5-6', '2029-4-25', '2030-4-14', '2031-4-4', '2032-3-23']
      regions: ["tr"]
    expect:
      name: "Kurban Bayramı (ikinci tatil)"
  - given:
      date: ['2017-9-3', '2018-8-23', '2019-8-13', '2020-8-02', '2021-7-22', '2022-7-11', '2023-6-30', '2024-6-18', '2025-6-8', '2026-5-29', '2027-5-18', '2028-5-7', '2029-4-26', '2030-4-15', '2031-4-5', '2032-3-24']
      regions: ["tr"]
    expect:
      name: "Kurban Bayramı (üçüncü tatil)"
  - given:
      date: ['2017-9-4', '2018-8-24', '2019-8-14', '2020-8-03', '2021-7-23', '2022-7-12', '2023-7-1', '2024-6-19', '2025-6-9', '2026-5-30', '2027-5-19', '2028-5-8', '2029-4-27', '2030-4-16', '2031-4-6', '2032-3-25']
      regions: ["tr"]
    expect:
      name: "Kurban Bayramı (dördüncü tatil)"
