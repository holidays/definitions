# Australian holiday definitions for the Ruby Holiday gem.
# Updated: 2020-07-15
# Sources:
# - http://en.wikipedia.org/wiki/Australian_public_holidays
# - http://www.docep.wa.gov.au/lr/LabourRelations/Content/Wages%20and%20Conditions/Public%20Holidays/Public_Holidays.html
# - http://www.wst.tas.gov.au/employment_info/public_holidays
# - https://www.fairwork.gov.au/leave/public-holidays/list-of-public-holidays
---
region_names:
  au: "Australia"
  au_act: "Australian Capital Territory"
  au_nsw: "New South Wales"
  au_nt: "Northern Territory"
  au_qld: "Queensland"
  au_qld_brisbane: "Brisbane"
  au_qld_cairns: "Cairns"
  au_sa: "South Australia"
  au_tas: "Tasmania"
  au_tas_north: "Northern Tasmania"
  au_tas_south: "Southern Tasmania"
  au_vic: "Victoria"
  au_vic_melbourne: "Melbourne"
  au_wa: "Western Australia"
months:
  0:
  - name: Good Friday
    regions: [au]
    function: easter(year)
    function_modifier: -2
  - name: Easter Saturday
    regions: [au_nsw, au_vic, au_qld, au_nt, au_act, au_sa]
    function: easter(year)
    function_modifier: -1
  - name: Easter Sunday
    regions: [au_nsw, au_vic]
    function: easter(year)
  - name: Easter Sunday
    regions: [au_qld, au_act]
    function: easter(year)
    year_ranges:
      from: 2017
  - name: Easter Monday
    regions: [au]
    function: easter(year)
    function_modifier: 1
  1:
  - name: New Year's Day
    regions: [au, au_nsw, au_vic, au_act, au_sa, au_wa, au_nt, au_qld]
    mday: 1
    observed: to_monday_if_weekend(date)
  - name: New Year's Day
    regions: [au_tas]
    mday: 1
    function: to_monday_if_weekend(date)
  - name: Australia Day
    regions: [au]
    mday: 26
    observed: to_monday_if_weekend(date)
  2:
  - name: Royal Hobart Regatta
    regions: [au_tas_south]
    week: 2
    wday: 1
  3:
  - name: Labour Day
    regions: [au_wa]
    week: 1
    wday: 1
  - name: Eight Hours Day
    regions: [au_tas]
    week: 2
    wday: 1
  - name: Labour Day
    regions: [au_vic]
    week: 2
    wday: 1
  - name: March Public Holiday
    regions: [au_sa]
    function: march_pub_hol_sa(year)
    year_ranges:
      from: 2006
  - name: Canberra Day
    regions: [au_act]
    week: 2
    wday: 1
  4:
  - name: ANZAC Day
    regions: [au]
    mday: 25
  - name: ANZAC Day
    regions: [au_qld, au_nt, au_act, au_sa]
    mday: 25
    observed: to_monday_if_sunday(date)
  - name: ANZAC Day
    regions: [au_vic]
    mday: 25
  - name: ANZAC Day
    regions: [au_wa]
    mday: 25
    observed: to_monday_if_weekend(date)
  5:
  - name: Labour Day
    regions: [au_qld]
    function: qld_labour_day_may(year)
    year_ranges:
      until: 2012
  - name: Labour Day
    regions: [au_qld]
    function: qld_labour_day_may(year)
    year_ranges:
      from: 2016
  - name: May Day
    regions: [au_nt]
    week: 1
    wday: 1
  - name: May Public Holiday
    regions: [au_sa]
    function: may_pub_hol_sa(year)
    year_ranges:
      until: 2005
  - name: Reconciliation Day
    mday: 27
    regions: [au_act]
    function: to_nearest_monday_after(date)
    year_ranges:
      from: 2018
  6:
  - name: Western Australia Day
    regions: [au_wa]
    week: 1
    wday: 1
  - name: Queen's Birthday
    regions: [au_act, au_nsw, au_sa, au_tas, au_nt, au_vic]
    week: 2
    wday: 1
    year_ranges:
      until: 2022
  - name: King's Birthday
    regions: [au_act, au_nsw, au_sa, au_tas, au_nt, au_vic]
    week: 2
    wday: 1
    year_ranges:
      from: 2023
  - name: Queen's Birthday
    regions: [au_qld]
    function: qld_queens_birthday_june(year)
    year_ranges:
      until: 2015
  - name: Queensland Day
    regions: [au_qld]
    mday: 6
    type: informal
  7:
  - name: Cairns Show
    regions: [au_qld_cairns]
    week: 3
    wday: 5
  8:
  - name: Ekka
    regions: [au_qld_brisbane]
    function: qld_brisbane_ekka_holiday(year)
  9:
  - name: National Day of Mourning for Her Majesty Queen Elizabeth II
    regions: [au]
    mday: 22
    year_ranges:
      limited: [2022]
  - name: Queen's Birthday
    regions: [au_wa]
    week: -1
    wday: 1
    year_ranges:
      until: 2021
  - name: King's Birthday
    regions: [au_wa]
    week: -1
    wday: 1
    year_ranges:
      from: 2022
  - name: "Family & Community Day"
    regions: [au_act]
    week: -1
    wday: 1
    year_ranges:
      until: 2017
  10:
  - name: Friday before the AFL Grand Final
    regions: [au_vic]
    function: afl_grand_final(year)
  - name: Labour Day
    regions: [au_act, au_nsw, au_sa]
    week: 1
    wday: 1
  - name: Labour Day
    regions: [au_qld]
    function: qld_labour_day_october(year)
    observed: to_monday_if_weekend(date)
    year_ranges:
      between:
        start: 2013
        end: 2015
  - name: Queen's Birthday
    regions: [au_qld]
    mday: 1
    observed: to_monday_if_weekend(date)
    year_ranges:
      limited: [2012]
  - name: Queen's Birthday
    regions: [au_qld]
    function: qld_queens_bday_october(year)
    observed: to_monday_if_weekend(date)
    year_ranges:
      between:
        start: 2016
        end: 2022
  - name: King's Birthday
    regions: [au_qld]
    function: qld_kings_bday_october(year)
    observed: to_monday_if_weekend(date)
    year_ranges:
      from: 2023
  - name: Royal Hobart Show
    regions: [au_tas_south]
    function: hobart_show_day(year)
  11:
  - name: G20 Day
    regions: [au_qld_brisbane]
    mday: 14
    year_ranges:
      limited: [2014]
  - name: Recreation Day # http://www.timeanddate.com/holidays/australia/recreation-day
    regions: [au_tas_north]
    wday: 1
    week: 1
  - name: Melbourne Cup Day
    regions: [au_vic_melbourne]
    week: 1
    wday: 2
  12:
  - name: Christmas Day # CHRISTMAS DAY - All states except SA observe on 27th (and 25th) if 25th is a Sunday
    regions: [au_qld, au_nsw, au_act, au_tas, au_wa, au_vic, au_nt]
    mday: 25
    observed: to_tuesday_if_sunday_or_monday_if_saturday(date)
  - name: Boxing Day
    regions: [au_nsw, au_vic, au_qld, au_act, au_wa]
    mday: 26
    observed: to_tuesday_if_sunday_or_monday_if_saturday(date)
  - name: Boxing Day
    regions: [au_tas, au_nt]
    function: to_weekday_if_boxing_weekend_from_year(year)
  - name: Proclamation Day
    regions: [au_sa]
    function: to_weekday_if_boxing_weekend_from_year_or_to_tuesday_if_monday(year)
  - name: Christmas Day # CHRISTMAS DAY - SA observes on 26th if 25th is a Sunday (Boxing Day goes to 27th)
    regions: [au_sa]
    mday: 25
    observed: to_monday_if_weekend(date)
