    regions: [jp]
    mday: 3
  - name: 振替休日
    regions: [jp]
    mday: 3
    function: jp_substitute_holiday(year, month, day)
  - name: 勤労感謝の日
    regions: [jp]
    mday: 23
  - name: 振替休日
    regions: [jp]
    mday: 23
    function: jp_substitute_holiday(year, month, day)
  12:
  - name: 天皇誕生日
    regions: [jp]
    mday: 23
    year_ranges:
      until: 2018
  - name: 振替休日
    regions: [jp]
    mday: 23
    function: jp_substitute_holiday(year, month, day)
    year_ranges:
      until: 2018
