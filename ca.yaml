    regions: [ca_bc]
    wday: 1
  - name: Saskatchewan Day
    week: 1
    regions: [ca_sk]
    wday: 1
  - name: Heritage Day
    week: 1
    regions: [ca_ab]
    type: informal
    wday: 1
  - name: Natal Day
