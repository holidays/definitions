  - name: National Patriotes Day
    regions: [ca_qc]
    function: ca_victoria_day(year)
  6:
  - name: Discovery Day
    regions: [ca_nl]
    mday: 24
    type: informal
  - name: Fête Nationale
    regions: [ca_qc]
    mday: 24
  # Northwest Territories: the National Indigenous Peoples Day Act (SNWT 2021, c. 15), assented to
  # December 9, 2021, renamed the day in its own s. 1 and in the Employment Standards Act s. 22(1), so
  # 2022 was the first June 21 under the new name
  - name: National Aboriginal Day
    regions: [ca_nt]
    mday: 21
    year_ranges:
      until: 2021
  - name: National Indigenous Peoples Day
    regions: [ca_nt]
    mday: 21
    year_ranges:
      from: 2022
  # Yukon: the Employment Standards Act (RSY 2002, c. 72) s. 1 has listed the day since 2017, and the
  # Act to amend the National Aboriginal Day Act (2023) (SY 2023, c. 6) s. 5, assented to April 20, 2023,
  # renamed it, https://laws.yukon.ca/cms/images/LEGISLATION/PRINCIPAL/2002/2002-0072/2002-0072.pdf
  - name: National Aboriginal Day
    regions: [ca_yt]
    mday: 21
    year_ranges:
      between:
        start: 2017
        end: 2022
  - name: National Indigenous Peoples Day
    regions: [ca_yt]
    mday: 21
    year_ranges:
      from: 2023
