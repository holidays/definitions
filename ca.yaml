# Canadian holiday definitions for the Ruby Holiday gem.
# Updated 2026-11-09.
#
# Notes:
#  - 'Family Day' in various provinces are only celebrated after certain years: http://www.timeanddate.com/holidays/canada/family-day
#  - 'Family Day' for New Brunswick after 2018  http://www.gnb.ca/legis/bill/FILE/58/3/Bill-67-e.htm
#  - 'National Aboriginal Day' in Yukon: Bill 2 received Royal Assent on May 8, 2017
#    (http://www.gov.yk.ca/news/17-075.html). The Act to amend the National Aboriginal Day Act (2023) (SY 2023, c. 6)
#    s. 5, assented to April 20, 2023, renamed it 'National Indigenous Peoples Day' in the Employment Standards Act
#    (RSY 2002, c. 72) s. 1, https://laws.yukon.ca/cms/images/LEGISLATION/AMENDING/2023/2023-0006/2023-0006.pdf
#  - 'National Aboriginal Day' in the Northwest Territories was renamed 'National Indigenous Peoples Day' by the
#    National Indigenous Peoples Day Act (SNWT 2021, c. 15), assented to December 9, 2021 (Hansard p. 3381,
#    https://www.ntlegislativeassembly.ca/sites/default/files/legacy/hn211209.pdf), so 2022 was the first June 21 under
#    the new name,
#    https://gnwt.ca/sites/default/files/legacy_justice/files/legislation/national-indigenous-peoples-day/national-indigenous-peoples-day.a.pdf
#  - 'Nunavut’s legislative assembly voted to pass Bill 29 making Nunavut Day', July 9, an officially statutory holiday across the territory. https://www.gov.nu.ca/human-resources/information/public-service-holidays
#  - 'According to Manitoba labour standards, Terry Fox Day is not a formal holiday. https://www.gov.mb.ca/labour/standards/doc,gen-holidays-after-april-30-07,factsheet.html#q13'
#  - Manitoba's National Day for Truth and Reconciliation is a general holiday from 2024: The Employment Standards Code
#    Amendment and Interpretation Amendment Act (Orange Shirt Day), S.M. 2023, c. 50, in force December 7, 2023.
#    https://web2.gov.mb.ca/laws/statutes/2023/c05023.php?lang=en
#  - A New Year's Day, Canada Day, National Day for Truth and Reconciliation, Remembrance Day, Christmas Day or Boxing
#    Day that falls on a Saturday or Sunday moves only where a statute names the substitute day, which in most regions
#    is the Interpretation or Legislation Act's definition of "holiday". Employment standards statutes that instead give
#    the employee holiday pay or a day off in lieu (Manitoba's Employment Standards Code, C.C.S.M. c. E110, s. 26(2)(b);
#    Newfoundland and Labrador's Labour Standards Act, R.S.N.L. 1990 c. L-2, s. 16; Nova Scotia's Labour Standards Code,
#    R.S.N.S. 1989 c. 246, s. 38; Prince Edward Island's Employment Standards Act, R.S.P.E.I. 1988 c. E-6.3, s. 27(2))
#    leave the public date where it is.
#    A Sunday holiday moves to the Monday and a Saturday one stays on its date in Manitoba (Interpretation Act, C.C.S.M.
#    c. I80, s. 23(2), which observes a Sunday Christmas Day on December 27 and excepts Remembrance Day,
#    https://web2.gov.mb.ca/laws/statutes/ccsm/i080.php?lang=en), New Brunswick (Interpretation Act, R.S.N.B. 1973
#    c. I-13, s. 38, whose list takes in any day a Statute in force in the Province appoints as a general holiday, which
#    the Holidays Act, R.S.C. 1985 c. H-5, s. 3 does for Remembrance Day and no Statute does for Boxing Day, a
#    prescribed day of rest for retail closing under the Days of Rest Act, S.N.B. 1985 c. D-4.2,
#    https://laws.gnb.ca/en/document/cs/I-13), Newfoundland and Labrador (Interpretation Act, R.S.N.L. 1990 c. I-19,
#    s. 27(1.1), https://www.assembly.nl.ca/legislation/sr/statutes/i19.htm), Nova Scotia (Interpretation Act, R.S.N.S.
#    1989 c. 235, s. 7(1)(j), which excepts Remembrance Day,
#    https://nslegislature.ca/sites/default/files/legc/statutes/interpretation.pdf), Ontario (Legislation Act, 2006,
#    S.O. 2006 c. 21, Sched. F, s. 88(3) to (5), in force July 25, 2007, https://www.ontario.ca/laws/statute/06l21,
#    which observes a Saturday Christmas Day on the Monday and a Sunday one on the Tuesday and moves no other Saturday
#    holiday and no Boxing Day; until 2006 the Interpretation Act, R.S.O. 1990 c. I.11, s. 29(1) moved every Sunday
#    holiday except Remembrance Day to the Monday), Saskatchewan (Legislation Act, S.S. 2019 c. L-10.2, s. 2-29, which
#    excepts Remembrance Day and Boxing Day, https://pubsaskdev.blob.core.windows.net/pubsask-prod/112676/L10-2.pdf; The
#    Employment Standards Regulations, 2025, R.R.S. c. S-15.1 Reg 15, s. 5-6 observes a Sunday New Year's Day, Christmas
#    Day or Remembrance Day on the Monday in every establishment not normally open on Sunday,
#    https://pubsaskdev.blob.core.windows.net/pubsask-prod/153135/S15-1r15.pdf, as The Employment Standards Regulations,
#    R.R.S. c. S-15.1 Reg 5, s. 29 did from April 29, 2014,
#    https://pubsaskdev.blob.core.windows.net/pubsask-prod/archived/78231/S15-1r5.pdf, and The Labour Standards
#    Regulations, 1995, R.R.S. c. L-1 Reg 5, s. 21 from February 3, 1995,
#    https://pubsaskdev.blob.core.windows.net/pubsask-prod/archived/2109/L1R5.pdf) and Yukon (Interpretation Act, R.S.Y.
#    2002 c. 125, s. 21, which excepts Remembrance Day and does not list Boxing Day,
#    https://laws.yukon.ca/cms/images/LEGISLATION/PRINCIPAL/2002/2002-0125/2002-0125.pdf).
#    A Saturday or Sunday holiday moves to the Monday in the Northwest Territories (Interpretation Act, S.N.W.T. 2017
#    c. 19, s. 21(o), as substituted by S.N.W.T. 2022 c. 8, s. 3,
#    https://gnwt.ca/sites/default/files/legacy_justice/files/legislation/interpretation/interpretation.a.pdf) and
#    Nunavut (Legislation Act, C.S.Nu. c. L-60, s. 1 "holiday" (o), in force July 1, 2021; (p) observes a Sunday Boxing
#    Day on the Tuesday, and the Monday stays for the earlier years).
#    Alberta (Interpretation Act, R.S.A. 2000 c. I-8, s. 28(1)(x), which observes a Sunday or Monday December 26 on
#    December 27 and moves nothing else, https://kings-printer.alberta.ca/documents/Acts/I08.pdf), British Columbia
#    (Interpretation Act, R.S.B.C. 1996 c. 238, s. 29,
#    https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96238_01), Prince Edward Island (Interpretation
#    Act, R.S.P.E.I. 1988 c. I-8.1, Schedule, s. 1(w) "holiday",
#    https://www.princeedwardisland.ca/sites/default/files/legislation/i-08-1-interpretation_act.pdf) and Quebec
#    (Interpretation Act, CQLR c. I-16, s. 61(23)) keep the holiday on its date.
#    Two entries approximate their statute, as their comments explain: Manitoba's Christmas Day also moves a Saturday to
#    Monday, December 27, and Alberta's Boxing Day leaves a Monday December 26 in place. Each rule applies to every year
#    unless the entry gives a year range, though some of the statutes commenced later.
#  - A Sunday July 1 is observed on July 2 throughout Canada (Holidays Act, R.S.C. 1985 c. H-5, s. 2(2)).
#  - In Quebec a Sunday June 24 is observed on June 25 for employees who do not ordinarily work on Sundays (National
#    Holiday Act, CQLR c F-1.1, s. 2, https://www.legisquebec.gouv.qc.ca/en/document/cs/F-1.1).
---
region_names:
  ca: "Canada"
  ca_ab: "Alberta"
  ca_bc: "British Columbia"
  ca_mb: "Manitoba"
  ca_nb: "New Brunswick"
  ca_nl: "Newfoundland and Labrador"
  ca_ns: "Nova Scotia"
  ca_nt: "Northwest Territories"
  ca_nu: "Nunavut"
  ca_on: "Ontario"
  ca_pe: "Prince Edward Island"
  ca_qc: "Quebec"
  ca_sk: "Saskatchewan"
  ca_yt: "Yukon"
months:
  0:
  - name: Good Friday
    regions: [ca]
    function: easter(year)
    function_modifier: -2
  - name: Easter Sunday
    regions: [ca]
    function: easter(year)
    type: informal
  - name: Easter Monday
    regions: [ca]
    function: easter(year)
    function_modifier: 1
    type: informal
  1:
  # Weekend observance differs by region; see the note at the top of the file. The ca entry carries the rule of
  # Manitoba, New Brunswick, Newfoundland and Labrador, Nova Scotia, Ontario, Saskatchewan and Yukon: a Sunday New
  # Year's Day moves to the Monday and a Saturday one stays
  - name: New Year's Day
    regions: [ca]
    excluded_regions: [ca_ab, ca_bc, ca_nt, ca_nu, ca_pe, ca_qc]
    mday: 1
    observed: to_monday_if_sunday(date)
  - name: New Year's Day
    regions: [ca_nt, ca_nu]
    mday: 1
    observed: to_monday_if_weekend(date)
  - name: New Year's Day
    regions: [ca_ab, ca_bc, ca_pe, ca_qc]
    mday: 1
  # January 2 is not a statutory holiday in Quebec: the Act respecting labour standards (CQLR c N-1.1)
  # s. 60 lists January 1 and no January 2 (https://www.legisquebec.gouv.qc.ca/en/document/cs/N-1.1),
  # nor does the CNESST (https://cnesst.gouv.qc.ca/en/working-conditions/leave/statutory-holidays/statutory-holidays).
  # Kept as informal because some employers give the day.
  - name: Day after New Year's Day
    regions: [ca_qc]
    mday: 2
    type: informal
  2:
  - name: Family Day
    regions: [ca_ab]
    wday: 1
    week: 3
    year_ranges:
      from: 1990
  - name: Family Day
    regions: [ca_sk]
    wday: 1
    week: 3
    year_ranges:
      from: 2007
  - name: Family Day
    regions: [ca_on]
    wday: 1
    week: 3
    year_ranges:
      from: 2008
  - name: Family Day
    regions: [ca_bc]
    wday: 1
    week: 2
    year_ranges:
      between:
        start: 2013
        end: 2018
  - name: Family Day
    regions: [ca_bc]
    wday: 1
    week: 3
    year_ranges:
      from: 2019
  - name: Family Day
    regions: [ca_nb]
    wday: 1
    week: 3
    year_ranges:
      from: 2018
  - name: Louis Riel Day
    regions: [ca_mb]
    wday: 1
    week: 3
  - name: Nova Scotia Heritage Day
    regions: [ca_ns]
    wday: 1
    week: 3
    year_ranges:
      from: 2015
  - name: Islander Day
    regions: [ca_pe]
    wday: 1
    week: 3
  3:
  - name: St. Patrick's Day
    regions: [ca_nl]
    mday: 17
    type: informal
  - name: St. George's Day
    regions: [ca_nl]
    mday: 23
    type: informal
  5:
  - name: Victoria Day
    regions: [ca_ab, ca_bc, ca_mb, ca_nt, ca_nu, ca_on, ca_sk, ca_yt]
    function: ca_victoria_day(year)
  - name: National Patriotes Day
    regions: [ca_qc]
    function: ca_victoria_day(year)
  6:
  - name: Discovery Day
    regions: [ca_nl]
    mday: 24
    type: informal
  - name: Fête Nationale
    regions: [ca_qc]
    mday: 24
    observed: to_monday_if_sunday(date)
  # Northwest Territories: the National Indigenous Peoples Day Act (SNWT 2021, c. 15), assented to
  # December 9, 2021, renamed the day in its own s. 1 and in the Employment Standards Act s. 22(1), so
  # 2022 was the first June 21 under the new name. A weekend June 21 moves to the Monday under the
  # Interpretation Act (SNWT 2017, c. 19) s. 21, as substituted by SNWT 2022, c. 8, s. 3, which
  # lists the day at (e) and gives "the following Monday" at (o); the consolidation of January 25,
  # 2019 gave the same Monday at (c),
  # https://gnwt.ca/sites/default/files/legacy_justice/files/legislation/interpretation/interpretation.a.pdf
  - name: National Aboriginal Day
    regions: [ca_nt]
    mday: 21
    observed: to_monday_if_weekend(date)
    year_ranges:
      until: 2021
  - name: National Indigenous Peoples Day
    regions: [ca_nt]
    mday: 21
    observed: to_monday_if_weekend(date)
    year_ranges:
      from: 2022
  # Yukon: the National Aboriginal Day Act (SY 2017, c. 1) made June 21 a holiday from 2017 and its
  # s. 2 added it to the Employment Standards Act (RSY 2002, c. 72) s. 1, and the Act to amend the
  # National Aboriginal Day Act (2023) (SY 2023, c. 6) s. 5, assented to April 20, 2023, renamed it,
  # https://laws.yukon.ca/cms/images/LEGISLATION/PRINCIPAL/2017/2017-0001/2017-0001.pdf and
  # https://laws.yukon.ca/cms/images/LEGISLATION/PRINCIPAL/2002/2002-0072/2002-0072.pdf.
  # The Interpretation Act (RSY 2002, c. 125) s. 21 lists the day in its definition of "holiday" and
  # makes the day after a Sunday holiday a holiday, so a Sunday June 21 moves to the Monday and a
  # Saturday one stays, https://laws.yukon.ca/cms/images/LEGISLATION/PRINCIPAL/2002/2002-0125/2002-0125.pdf
  - name: National Aboriginal Day
    regions: [ca_yt]
    mday: 21
    observed: to_monday_if_sunday(date)
    year_ranges:
      between:
        start: 2017
        end: 2022
  - name: National Indigenous Peoples Day
    regions: [ca_yt]
    mday: 21
    observed: to_monday_if_sunday(date)
    year_ranges:
      from: 2023
  7:
  # A Sunday July 1 is observed on July 2 everywhere (Holidays Act, R.S.C. 1985 c. H-5, s. 2(2)); the Northwest
  # Territories and Nunavut also move a Saturday one to the Monday, see the note at the top of the file
  - name: Canada Day
    regions: [ca]
    excluded_regions: [ca_nt, ca_nu]
    mday: 1
    observed: to_monday_if_sunday(date)
  - name: Canada Day
    regions: [ca_nt, ca_nu]
    mday: 1
    observed: to_monday_if_weekend(date)
  - name: Orangemen's Day
    regions: [ca_nl]
    mday: 12
    type: informal
  - name: Nunavut Day
    regions: [ca_nu]
    mday: 9
    observed: to_monday_if_weekend(date)
    year_ranges:
      from: 2020
  8:
  - name: B.C. Day
    week: 1
    regions: [ca_bc]
    wday: 1
  - name: Saskatchewan Day
    week: 1
    regions: [ca_sk]
    wday: 1
  - name: Heritage Day
    week: 1
    regions: [ca_ab]
    type: informal
    wday: 1
  - name: Natal Day
    week: 1
    regions: [ca_ns]
    wday: 1
    type: informal
  - name: Civic Holiday
    week: 1
    regions: [ca_nt, ca_nu]
    wday: 1
  - name: Civic Holiday
    week: 1
    regions: [ca_on, ca_pe]
    wday: 1
    type: informal
  - name: New Brunswick Day
    week: 1
    regions: [ca_nb]
    wday: 1
  - name: Terry Fox Day
    week: 1
    regions: [ca_mb]
    wday: 1
    type: informal
  - name: Discovery Day
    week: 3
    regions: [ca_yt]
    wday: 1
  9:
  - name: Labour Day
    week: 1
    regions: [ca]
    wday: 1
  # Weekend observance differs by region; see the note at the top of the file
  # British Columbia established the day by the National Day for Truth and Reconciliation Act
  # (SBC 2023, c. 4), in force on Royal Assent, March 9, 2023, whose s. 3 adds it to the Employment
  # Standards Act s. 1(1) statutory holidays, so 2023 is its first year there,
  # https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/23004 (s. 3 as passed:
  # https://www.bclaws.gov.bc.ca/civix/document/id/bills/billsprevious/4th42nd:gov02-3)
  - name: National Day for Truth and Reconciliation
    regions: [ca_bc]
    mday: 30
    year_ranges:
      from: 2023
  # Prince Edward Island added "National Day for Truth and Reconciliation, observed on September 30"
  # to the Employment Standards Act s. 6(1) paid holidays by An Act to Amend the Employment Standards
  # Act (No. 2) (SPEI 2021, c. 33), assented to November 17, 2021 with no commencement clause, so 2022
  # is its first year there
  - name: National Day for Truth and Reconciliation
    regions: [ca_pe]
    mday: 30
    year_ranges:
      from: 2022
  # The Northwest Territories added September 30 to the Employment Standards Act s. 22(1) and to the
  # Interpretation Act s. 21 by An Act to Amend the Employment Standards Act, No. 2 (SNWT 2022, c. 8),
  # which has no commencement clause and so took effect on assent in 2022, its first statutory year there,
  # https://ntlegislativeassembly.ca/sites/default/files/legacy/bill_47.pdf. In 2021 the Public Service
  # Holidays Order (R-052-2021) made September 30, 2021 a holiday for the territorial public service only
  # (s. 4 of the same Act amends that order), so that year is informal
  - name: National Day for Truth and Reconciliation
    regions: [ca_nt]
    mday: 30
    observed: to_monday_if_weekend(date)
    type: informal
    year_ranges:
      limited: [2021]
  - name: National Day for Truth and Reconciliation
    regions: [ca_nt]
    mday: 30
    observed: to_monday_if_weekend(date)
    year_ranges:
      from: 2022
  # Yukon established the day by the National Day for Truth and Reconciliation Act (SY 2022, c. 18),
  # assented to November 24, 2022, whose s. 2 adds it to the Employment Standards Act s. 1 general
  # holidays, and whose s. 3 adds it to the Interpretation Act s. 21 "holiday", so 2023 is its first year
  # there and a Sunday September 30 moves to the Monday,
  # https://laws.yukon.ca/cms/images/LEGISLATION/AMENDING/2022/2022-0018/2022-0018.pdf
  - name: National Day for Truth and Reconciliation
    regions: [ca_yt]
    mday: 30
    observed: to_monday_if_sunday(date)
    year_ranges:
      from: 2023
  - name: National Day for Truth and Reconciliation
    regions: [ca_ab]
    mday: 30
    type: informal
    year_ranges:
      from: 2021
  # Nunavut's Labour Standards Act (C.S.Nu. c. L-10) s. 1 lists "National Day for Truth and
  # Reconciliation, observed on September 30" as a general holiday, added by S.Nu. 2022, c. 7, s. 1,
  # in force June 13, 2022 (official consolidation of June 13, 2022, nunavutlegislation.ca)
  - name: National Day for Truth and Reconciliation
    regions: [ca_nu]
    mday: 30
    observed: to_monday_if_weekend(date)
    type: informal
    year_ranges:
      limited: [2021]
  - name: National Day for Truth and Reconciliation
    regions: [ca_nu]
    mday: 30
    observed: to_monday_if_weekend(date)
    year_ranges:
      from: 2022
  # Manitoba made September 30 a general holiday by S.M. 2023, c. 50 (in force December 7, 2023), so its
  # first statutory September 30 is 2024, https://web2.gov.mb.ca/laws/statutes/2023/c05023.php?lang=en.
  # The same Act listed the day in the Interpretation Act s. 23(1), whose s. 23(2) moves a Sunday holiday
  # to the Monday
  - name: National Day for Truth and Reconciliation
    regions: [ca_mb]
    mday: 30
    type: informal
    year_ranges:
      between:
        start: 2021
        end: 2023
  - name: National Day for Truth and Reconciliation
    regions: [ca_mb]
    mday: 30
    observed: to_monday_if_sunday(date)
    year_ranges:
      from: 2024
  10:
  - name: Thanksgiving
    week: 2
    regions: [ca_ab, ca_bc, ca_mb, ca_nt, ca_nu, ca_on, ca_qc, ca_sk, ca_yt]
    wday: 1
  11:
  # Weekend observance differs by region; see the note at the top of the file
  - name: Remembrance Day
    regions: [ca_nt, ca_nu]
    mday: 11
    observed: to_monday_if_weekend(date)
  - name: Remembrance Day
    regions: [ca_nb, ca_nl, ca_sk]
    mday: 11
    observed: to_monday_if_sunday(date)
  - name: Remembrance Day
    regions: [ca_ab, ca_bc, ca_pe, ca_yt]
    mday: 11
  12:
  # Ontario's Legislation Act, 2006 (S.O. 2006 c. 21, Sched. F, in force July 25, 2007) s. 88(5) makes the Monday after
  # a Saturday Christmas Day and the Tuesday after a Sunday one a holiday; the Interpretation Act (R.S.O. 1990 c. I.11)
  # s. 29(1) it replaced moved a Sunday holiday to the Monday and left a Saturday one on its date
  - name: Christmas Day
    regions: [ca_on]
    mday: 25
    observed: to_monday_if_sunday(date)
    year_ranges:
      until: 2006
  - name: Christmas Day
    regions: [ca_on]
    mday: 25
    observed: to_tuesday_if_sunday_or_monday_if_saturday(date)
    year_ranges:
      from: 2007
  # Weekend observance differs by region; see the note at the top of the file
  - name: Christmas Day
    regions: [ca_nt, ca_nu]
    mday: 25
    observed: to_monday_if_weekend(date)
  - name: Christmas Day
    regions: [ca_nb, ca_nl, ca_ns, ca_sk, ca_yt]
    mday: 25
    observed: to_monday_if_sunday(date)
  # Manitoba's Interpretation Act s. 23(2) observes a Sunday Christmas Day on December 27 and leaves a Saturday one on
  # its date. No function gives that alone, so this one also moves a Saturday Christmas Day to the Monday, December
  # 27, which is a holiday that year anyway as the day after a Sunday Boxing Day
  - name: Christmas Day
    regions: [ca_mb]
    mday: 25
    observed: to_tuesday_if_sunday_or_monday_if_saturday(date)
  - name: Christmas Day
    regions: [ca_ab, ca_bc, ca_pe, ca_qc]
    mday: 25
  # Neither Ontario Act moves Boxing Day
  - name: Boxing Day
    regions: [ca_on]
    mday: 26
  # Weekend observance differs by region; see the note at the top of the file
  - name: Boxing Day
    regions: [ca_nt]
    mday: 26
    observed: to_monday_if_weekend(date)
    type: informal
  # Nunavut's Legislation Act (C.S.Nu. c. L-60, in force July 1, 2021) s. 1 "holiday" (p) adds the Tuesday
  # after a Sunday Boxing Day; the Monday stays for the earlier years
  - name: Boxing Day
    regions: [ca_nu]
    mday: 26
    observed: to_monday_if_weekend(date)
    type: informal
    year_ranges:
      until: 2020
  - name: Boxing Day
    regions: [ca_nu]
    mday: 26
    observed: to_tuesday_if_sunday_or_monday_if_saturday(date)
    type: informal
    year_ranges:
      from: 2021
  - name: Boxing Day
    regions: [ca_mb, ca_nl]
    mday: 26
    observed: to_monday_if_sunday(date)
    type: informal
  # Alberta's Interpretation Act s. 28(1)(x)(iv) makes December 27 the holiday when December 26 falls on a Sunday or a
  # Monday. No function gives the Monday case, so a Monday Boxing Day stays on its date here
  - name: Boxing Day
    regions: [ca_ab]
    mday: 26
    observed: to_monday_if_sunday(date)
    type: informal
  - name: Boxing Day
    regions: [ca_bc, ca_nb, ca_ns, ca_pe, ca_qc, ca_sk, ca_yt]
    mday: 26
    type: informal
tests:
  - given:
      date: '2008-01-01'
      regions: ["ca"]
      options: ["informal"]
    expect:
      name: "New Year's Day"
  - given:
      date: '2008-03-21'
      regions: ["ca"]
      options: ["informal"]
    expect:
      name: "Good Friday"
  - given:
      date: '2013-03-31'
      regions: ["ca"]
      options: ["informal"]
    expect:
      name: "Easter Sunday"
  - given:
      date: '2008-03-24'
      regions: ["ca"]
      options: ["informal"]
    expect:
      name: "Easter Monday"
  - given:
      date: '2008-07-01'
      regions: ["ca"]
      options: ["informal"]
    expect:
      name: "Canada Day"
  - given:
      date: '2008-09-01'
      regions: ["ca"]
      options: ["informal"]
    expect:
      name: "Labour Day"
  - given:
