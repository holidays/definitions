# Singapore holiday definitions for the Holidays gem!

# Singapore's movable holidays:
#
# * Chinese New Year (and its second day) follows the Chinese lunar calendar and
#   is computed with the shared lunar_to_solar method (1st and 2nd days of the
#   1st lunar month), so it is available for every year the lunar tables support.
# * Vesak Day, Hari Raya Puasa, Hari Raya Haji and Deepavali follow the Buddhist,
#   Islamic and Hindu calendars and are not reliably computable. They are listed
#   explicitly from the dates officially gazetted by the Ministry of Manpower and
#   currently cover 2017 through 2026; add new years here as they are gazetted.
#
# When any of these holidays falls on a Sunday the following Monday is a holiday,
# applied via to_monday_if_sunday(date).

# Source:
# Ministry of Manpower public holiday datasets, https://data.gov.sg (collection 691)
# http://publicholidays.sg/

---
region_names:
  sg: "Singapore"
months:
  0:
  - name: Good Friday
    regions: [sg]
    function: easter(year)
    function_modifier: -2
  1:
  - name: New Year's Day
    regions: [sg]
    mday: 1
    observed: to_monday_if_sunday(date)
  - name: Chinese New Year
    regions: [sg]
    function: lunar_to_solar(year, month, day, region)
    mday: 1
    observed: to_monday_if_sunday(date)
  - name: Chinese New Year
    regions: [sg]
    function: lunar_to_solar(year, month, day, region)
    mday: 2
    observed: to_monday_if_sunday(date)
  2:
  - name: Valentine's Day
    regions: [sg]
    mday: 14
    type: informal
  - name: Total Defence Day
