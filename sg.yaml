tests:
  - given:
      date: '2014-01-01'
      regions: ["sg"]
      options: ["informal"]
    expect:
      name: "New Year's Day"
  - given:
      date: '2014-02-14'
      regions: ["sg"]
      options: ["informal"]
    expect:
      name: "Valentine's Day"
  - given:
      date: '2014-02-15'
      regions: ["sg"]
      options: ["informal"]
    expect:
      name: "Total Defence Day"
  - given:
      date: '2014-04-18'
      regions: ["sg"]
      options: ["informal"]
    expect:
      name: "Good Friday"
  - given:
      date: '2014-05-01'
      regions: ["sg"]
      options: ["informal"]
    expect:
      name: "Labour Day"
  - given:
      date: '2014-08-09'
      regions: ["sg"]
      options: ["informal"]
    expect:
      name: "National Day"
  - given:
      date: '2014-12-25'
      regions: ["sg"]
      options: ["informal"]
    expect:
      name: "Christmas Day"
  # Chinese New Year is computed from the lunar calendar (both days), so it
  # resolves well beyond the gazetted range.
  - given:
      date: '2019-02-05'
      regions: ["sg"]
    expect:
      name: "Chinese New Year"
  - given:
      date: '2019-02-06'
      regions: ["sg"]
    expect:
      name: "Chinese New Year"
  - given:
      date: '2026-02-17'
      regions: ["sg"]
    expect:
      name: "Chinese New Year"
  - given:
      date: '2030-02-03'
      regions: ["sg"]
    expect:
      name: "Chinese New Year"
  # Issue #351: the three 2019 festival dates that fell on a Sunday
  - given:
      date: '2019-05-19'
      regions: ["sg"]
    expect:
      name: "Vesak Day"
  - given:
      date: '2019-08-11'
      regions: ["sg"]
    expect:
      name: "Hari Raya Haji"
  - given:
      date: '2019-10-27'
      regions: ["sg"]
    expect:
      name: "Deepavali"
  # ...and their Monday holidays-in-lieu
  - given:
      date: '2019-05-20'
      regions: ["sg"]
      options: ["observed"]
    expect:
      name: "Vesak Day"
  - given:
      date: '2019-08-12'
      regions: ["sg"]
      options: ["observed"]
    expect:
      name: "Hari Raya Haji"
  - given:
      date: '2019-10-28'
      regions: ["sg"]
      options: ["observed"]
    expect:
      name: "Deepavali"
  - given:
      date: '2019-06-05'
      regions: ["sg"]
    expect:
      name: "Hari Raya Puasa"
  # Vesak that drifts into June (would be missed if computed via the lunar
  # month section, so it is listed explicitly)
  - given:
      date: '2023-06-02'
      regions: ["sg"]
    expect:
      name: "Vesak Day"
  - given:
      date: '2025-05-12'
      regions: ["sg"]
    expect:
      name: "Vesak Day"
  # Deepavali (and Hari Raya/Vesak) are gazette-only, so they are not returned
  # beyond the officially announced range.
  - given:
      date: '2030-10-27'
      regions: ["sg"]
    expect:
      holiday: false

  # Observed rule (MOM): a public holiday falling on a Sunday moves to the
  # following Monday. A Saturday holiday gets no substitute and stays put.
  # https://www.mom.gov.sg/employment-practices/public-holidays

  # Saturday: the holiday stays on the Saturday.
  - given:
      date: ['2022-01-01', '2028-01-01', '2033-01-01']
      regions: ["sg"]
      options: ["observed"]
    expect:
      name: "New Year's Day"
  - given:
      date: ['2025-08-09', '2031-08-09']
      regions: ["sg"]
      options: ["observed"]
    expect:
      name: "National Day"
  - given:
      date: ['2021-12-25', '2027-12-25', '2032-12-25']
      regions: ["sg"]
      options: ["observed"]
    expect:
      name: "Christmas Day"

  # Saturday: no substitute is created on the preceding Friday.
  - given:
      date: ['2021-12-31', '2027-12-31', '2032-12-31', '2025-08-08',
             '2031-08-08', '2021-12-24', '2027-12-24', '2032-12-24']
      regions: ["sg"]
      options: ["observed"]
    expect:
      holiday: false

  # Sunday: the substitute falls on the following Monday.
  - given:
      date: ['2017-01-02', '2023-01-02', '2034-01-02']
      regions: ["sg"]
      options: ["observed"]
    expect:
      name: "New Year's Day"
  - given:
      date: ['2015-08-10', '2020-08-10', '2026-08-10']
      regions: ["sg"]
      options: ["observed"]
    expect:
      name: "National Day"
  - given:
      date: ['2016-12-26', '2022-12-26', '2033-12-26']
      regions: ["sg"]
      options: ["observed"]
    expect:
      name: "Christmas Day"
