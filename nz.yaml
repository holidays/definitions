# New Zealand holiday definitions for the Ruby Holiday gem.
# Updated: 2010-03-28.
# Sources:
# - http://en.wikipedia.org/wiki/Public_holidays_in_New_Zealand
# - Matariki https://www.mbie.govt.nz/business-and-employment/employment-and-skills/employment-legislation-reviews/matariki/matariki-public-holiday/
---
region_names:
  nz: "New Zealand"
  nz_ak: "Auckland"
  nz_ca: "Canterbury"
  nz_ch: "Chatham Islands"
  nz_hb: "Hawke's Bay"
  nz_mb: "Marlborough"
  nz_ne: "Nelson"
  nz_nl: "Northland"
  nz_ot: "Otago"
  nz_sc: "South Canterbury"
  nz_sl: "Southland"
  nz_ta: "Taranaki"
  nz_we: "Wellington"
  nz_wl: "Westland"
months:
  0:
  - name: Good Friday
    regions: [nz]
    function: easter(year)
    function_modifier: -2
  - name: Easter Monday
    regions: [nz]
    function: easter(year)
    function_modifier: 1
  - name: Matariki
    regions: [nz]
    function: matariki(year)
  - name: Southland Anniversary Day
    regions: [nz_sl]
    function: easter(year)
    function_modifier: 2
  1:
  - name: New Year's Day
    regions: [nz]
    mday: 1
    observed: to_monday_if_weekend(date)
  - name: Day after New Year's Day
    regions: [nz]
    mday: 2
    observed: to_weekday_if_boxing_weekend(date)
  - name: Wellington Anniversary Day
    regions: [nz_we]
    mday: 22
    observed: closest_monday(date)
  - name: Auckland Anniversary Day
    regions: [nz_ak]
    mday: 29
    observed: closest_monday(date)
  - name: Northland Anniversary Day
    regions: [nz_nl]
    mday: 29
    observed: closest_monday(date)
  2:
  - name: Nelson Anniversary Day
    regions: [nz_ne]
    mday: 1
    observed: closest_monday(date)
  - name: Waitangi Day
    regions: [nz]
    mday: 6
    observed: to_monday_if_weekend(date)
  3:
  - name: Otago Anniversary Day
    regions: [nz_ot]
    mday: 23
    observed: closest_monday(date)
  - name: Taranaki Anniversary Day
    regions: [nz_ta]
    week: 2
    wday: 1
    observed: closest_monday(date)
  4:
  - name: ANZAC Day
    regions: [nz]
    mday: 25
    observed: to_monday_if_weekend(date)
  6:
  - name: Queen's Birthday
    regions: [nz]
    week: 1
    wday: 1
    year_ranges:
      until: 2022
  - name: King's Birthday
    regions: [nz]
    week: 1
    wday: 1
    year_ranges:
      from: 2023
  9:
  - name: Dominion Day
    regions: [nz_sc]
    week: 4
    wday: 1
  10:
  - name: Hawke's bay Anniversary Day
    regions: [nz_hb]
    week: 4
    wday: 1
    observed: previous_friday(date)
  - name: Labour Day
    regions: [nz]
    week: 4
    wday: 1
  - name: Marlborough Anniversary Day
    regions: [nz_mb]
    week: 4
    wday: 1
    observed: next_week(date)
  11:
  - name: Canterbury Anniversary Day
    regions: [nz_ca]
    function: nz_canterbury_anniversary(year)
  - name: Chatham Island Anniversary Day
    regions: [nz_ch]
    mday: 30
    observed: closest_monday(date)
  12:
  - name: Westland Anniversary Day
    regions: [nz_wl]
    mday: 1
    observed: closest_monday(date)
  - name: Christmas Day
    regions: [nz]
    mday: 25
    observed: to_monday_if_weekend(date)
  - name: Boxing Day
    regions: [nz]
    mday: 26
    observed: to_weekday_if_boxing_weekend(date)

tests:
  - given:
      date: '2024-04-02'
      regions: ["nz_sl"]
    expect:
      name: "Southland Anniversary Day"
  - given:
      date: '2025-04-22'
      regions: ["nz_sl"]
    expect:
      name: "Southland Anniversary Day"
  - given:
      date: '2024-10-25'
      regions: ["nz_hb"]
      options: ["observed"]
    expect:
      name: "Hawke's bay Anniversary Day"
  - given:
      date: '2025-10-24'
      regions: ["nz_hb"]
      options: ["observed"]
    expect:
      name: "Hawke's bay Anniversary Day"
  - given:
      date: '2007-01-01'
      regions: ["nz"]
      options: ["informal"]
    expect:
      name: "New Year's Day"
  - given:
      date: '2007-01-02'
      regions: ["nz"]
      options: ["informal"]
    expect:
      name: "Day after New Year's Day"
  - given:
      date: '2007-02-06'
      regions: ["nz"]
      options: ["informal"]
    expect:
      name: "Waitangi Day"
  - given:
