      regions: ["nz"]
    expect:
      name: "ANZAC Day"
  - given:
      date: '2015-04-27'
      regions: ["nz"]
      options: ["observed"]
    expect:
      name: "ANZAC Day"
  - given:
      date: '2016-04-25'
      regions: ["nz"]
    expect:
      name: "ANZAC Day"
  - given:
      date: '2016-04-25'
      regions: ["nz"]
      options: ["observed"]
    expect:
      name: "ANZAC Day"
  - given:
      date: '2015-02-06'
      regions: ["nz"]
    expect:
      name: "Waitangi Day"
  - given:
      date: '2015-02-06'
      regions: ["nz"]
      options: ["observed"]
    expect:
      name: "Waitangi Day"
  - given:
      date: '2016-02-06'
      regions: ["nz"]
    expect:
      name: "Waitangi Day"
  - given:
      date: '2016-02-08'
      regions: ["nz"]
      options: ["observed"]
    expect:
      name: "Waitangi Day"
  - given:
      date: '2016-02-01'
      regions: ["nz_ne"]
      options: ["observed"]
    expect:
      name: "Nelson Anniversary Day"
  - given:
      date: '2017-01-30'
      regions: ["nz_ne"]
