# Indonesia holiday definitions for the Holidays gem!
#
# National holidays (hari libur nasional). Since 2002 they are set each year by
# a joint decree of three ministers (SKB 3 Menteri: Religious Affairs, Manpower,
# and State Apparatus Empowerment and Bureaucratic Reform).
#
# * Fixed-date holidays: New Year's Day, Labour Day (from 2014, Keputusan
#   Presiden Nomor 24 Tahun 2013), Pancasila Day (from 2017, Keputusan Presiden
#   Nomor 24 Tahun 2016), Independence Day and Christmas.
# * Good Friday and Ascension Day follow Easter. Keputusan Presiden Nomor 8
#   Tahun 2024 renamed them from "Isa Almasih" to "Yesus Kristus" and made
#   Easter Sunday a national holiday from 2024.
# * Chinese New Year (Tahun Baru Imlek, a national holiday since 2003 under
#   Keputusan Presiden Nomor 19 Tahun 2002), the Islamic holidays, Nyepi
#   (Balinese Saka calendar) and Vesak follow the dates in each year's SKB,
#   because the government sets them from its own calendar and moon sighting
#   rather than an arithmetic rule. They are listed per year and currently
#   cover 2024 through 2027; add new years as each SKB is published.
#   27 Rajab (Isra Mikraj) falls twice in 2027.
# * 2024 also had two one-off national holidays for the general election
#   (Keputusan Presiden Nomor 10 Tahun 2024) and the regional elections
#   (Keputusan Presiden Nomor 33 Tahun 2024).
#
# Joint leave days (cuti bersama) are not included: they are deducted from
# annual leave and are not public holidays.
#
# Sources:
# https://peraturan.bpk.go.id/Details/276688/keppres-no-8-tahun-2024
# https://peraturan.bpk.go.id/Details/277337/keppres-no-10-tahun-2024
# https://peraturan.bpk.go.id/Details/308159/keppres-no-33-tahun-2024
# https://web.archive.org/web/20250413193349/https://setkab.go.id/pemerintah-tetapkan-hari-libur-nasional-dan-cuti-bersama-tahun-2025/
# https://www.setneg.go.id/baca/index/inilah_skb_3_menteri_libur_nasional_dan_cuti_bersama_2026
# https://web.archive.org/web/20260917182154/https://setneg.go.id/baca/index/inilah_skb_3_menteri_libur_nasional_dan_cuti_bersama_2027
# https://en.wikipedia.org/wiki/Public_holidays_in_Indonesia

