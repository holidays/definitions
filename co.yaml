# Colombian holiday definitions for the Ruby Holiday gem.
#
# Updated: 2026-07-10.
#
# Sources:
# - https://en.wikipedia.org/wiki/Public_holidays_in_Colombia
# - https://publicholidays.co/
# - https://www.calendariodecolombia.com/
# - https://www.officeholidays.com/countries/colombia/
# - https://www.timeanddate.com/holidays/colombia/
# - http://www.bank-holidays.com/country/Colombia_42.htm
# - https://www.mininterior.gov.co/noticias/gobierno-sanciona-ley-que-convierte-el-9-de-julio-en-nuevo-festivo-nacional/
---
region_names:
  co: "Colombia"
months:
  0:
  - name: Jueves Santo
    regions: [co]
    function: easter(year)
    function_modifier: -3
  - name: Viernes Santo
    regions: [co]
    function: easter(year)
    function_modifier: -2
  - name: Día de la Ascensión
    regions: [co]
    function: easter(year)
    function_modifier: 43
  - name: Corpus Christi
    regions: [co]
    function: easter(year)
    function_modifier: 64
  - name: Sagrado Corazón
    regions: [co]
    function: easter(year)
    function_modifier: 71
  1:
  - name: Año Nuevo
    regions: [co]
    mday: 1
  - name: Día de los Reyes Magos
    regions: [co]
    mday: 6
    function: to_following_monday_if_not_monday(date)
  3:
  - name: Día de San José
    regions: [co]
    mday: 19
    function: to_following_monday_if_not_monday(date)
  5:
  - name: Día del Trabajo
    regions: [co]
    mday: 1
  6:
  - name: San Pedro y San Pablo
    regions: [co]
    mday: 29
    function: to_following_monday_if_not_monday(date)
  7:
  # National holiday since 2026, established by Law 2578 of 2026.
  - name: Día de Nuestra Señora del Rosario de Chiquinquirá
    regions: [co]
    mday: 9
    function: to_following_monday_if_not_monday(date)
    year_ranges:
      from: 2026
  - name: Día de la Independencia
    regions: [co]
    mday: 20
  8:
  - name: Batalla de Boyacá
    regions: [co]
    mday: 7
  - name: La Asunción de la Virgen
    regions: [co]
    mday: 15
    function: to_following_monday_if_not_monday(date)
  10:
  - name: Día de la Raza
    regions: [co]
    mday: 12
    function: to_following_monday_if_not_monday(date)
  11:
  - name: Día de Todos los Santos
    regions: [co]
    mday: 1
    function: to_following_monday_if_not_monday(date)
  - name: Independencia de Cartagena
    regions: [co]
    mday: 11
    function: to_following_monday_if_not_monday(date)
  12:
  - name: Día de la Inmaculada Concepción
    regions: [co]
    mday: 8
  - name: Navidad
    regions: [co]
    mday: 25
